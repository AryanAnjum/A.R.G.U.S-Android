# Builds the ARGUS iPhone app on a GitHub-hosted Mac and uploads an unsigned .ipa.
# Install it from Windows with Sideloadly (it signs the app with your Apple ID). See ios/README.md.
name: iOS app

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project ARGUS.xcodeproj -scheme ARGUS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/ARGUS.app

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ARGUS.app Payload/
          zip -qry ARGUS-unsigned.ipa Payload
          ls -lh ARGUS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ARGUS-iPhone-ipa
          path: ios/ARGUS-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
