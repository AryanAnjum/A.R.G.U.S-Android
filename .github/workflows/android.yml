# Builds the ARGUS Android app on GitHub and uploads an installable APK.
# Download it from the run's "ARGUS-Android-apk" artifact and open it on the phone. See ANDROID.md.
name: Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner already has the Android SDK (ANDROID_HOME); accept its licences so Gradle can
      # download the platform this app compiles against.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ARGUS-android.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ARGUS-Android-apk
          path: out/ARGUS-android.apk
          retention-days: 30
